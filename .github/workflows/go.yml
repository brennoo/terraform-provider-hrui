name: Go
on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        firmware:
          - "SWTG118AS-v2.0.bin"
          - "SWTG018AS-A-v2.0.1.bin"
          - "HRRF_V200.2.5_ZX310S-4T2XH_0422.bin"
          - "S600WP-4GT-2SX-SEV1.9.bin"

    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
        id: go
      - uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install dependencies
        run: go get .
      - name: Install rtl51 emulator
        run: go install github.com/brennoo/rtl51/cmd/rtl51@latest
      - name: Build
        run: go build -v ./...
      - name: Test (Unit)
        run: go test ./...
      - name: Test (Acceptance)
        env:
          TF_ACC: "1"
          HRUI_FW_IMAGE: ${{ matrix.firmware }}
          HRUI_AUTOSAVE: "false"
        timeout-minutes: 30
        run: go test -v -timeout 15m ./... -run TestAcc
